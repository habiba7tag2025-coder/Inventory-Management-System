<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8 ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System </title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>




<body class="bg-gray-50 font-sans text-gray-800">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar (القائمة الجانبية) -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col hidden md:flex shadow-xl">

            <div class="p-6 text-xl font-extrabold tracking-wider text-white border-b border-slate-800 flex items-center gap-3">
                <i class="fa-solid  fa-boxes-stacked text-blue-500" ></i>
            
                <span>Inventory Hub </span>
            </div>

            <nav class="flex-1 p-4 space-y-2">

                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white font-medium shadow-md shadow-blue-600/30 transition">
                    <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                </a>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                <i class="fa-solid fa-tags w-5"></i> Categories
            </a>

                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-gear w-5"></i> Settings
                </a>

            <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-rose-500/10 hover:text-rose-500 text-slate-300 transition mt-auto">
                <i class="fa-solid fa-right-from-bracket w-5"></i> Logout
            </button>
            </nav>

            <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
                By Habiba Hassan.DYuki ^_^
            </div>

        </aside>

        <!--  (المحتوى الرئيسي) -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            
            <!-- Top Navbar -->
            <header class="bg-white border-b border-gray-200 h-20 flex items-center justify-between px-8 shadow-sm">
                <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold text-gray-800">Products Management</h1>
                </div>
                
                <div class="flex items-center space-x-3 bg-gray-100 px-4 py-2 rounded-full border border-gray-200">
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">D</div>
                
                <span class="text-sm font-semibold text-gray-700">DYuki ❄️</span>
                </div>
            </header>

            <!-- Page Content -->
    <div class="p-8 max-w-7xl mx-auto w-full">
                
                <!-- Actions & Search Bar -->
<div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                    
                    <!-- زرار فتح فورم الإضافة -->
        <button onclick="openModal()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg shadow-blue-600/20 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus"></i> Add New Product
        </button>
                    
                    <!-- شريط البحث -->
    <div class="w-full md:w-80 relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>

                <input type="text" id="searchInput" placeholder="Search by brand or model..." 
                            class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition shadow-sm">
        </div>
    </div>

                <!-- Products Table -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    
                    <div class="overflow-x-auto">
                        
                        <table class="w-full text-left border-collapse">
                        
                                <thead class="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th class= "p-4 text-gray-500 font-semibold text-xs uppercase tracking-wider">ID</th>
                                        <th class ="p-4 text-gray-500 font-semibold text-xs uppercase tracking-wider">Type Name </th>
                                        <th class=" p-4 text-gray-500 font-semibold text-xs uppercase tracking-wider">Model</th>
                                        <th class="p-4 text-gray-500 font-semibold text-xs uppercase tracking-wider" >Category </th>
                                        <th class ="p-4 text-gray-500 font-semibold text-xs uppercase tracking-wider">Price</th>
                                        <th class="p-4 text-gray-500 font-semibold text-xs uppercase tracking-wider" >Quantity</th>
                                        <th class ="p-4 text-gray-500 font-semibold text-xs uppercase tracking-wider text-center">Actions </th>
                                    </tr>
                                </thead>
                            
                            <tbody id= "productsTableBody" class="divide-y divide-gray-100">
                                
                            
                        </tbody>           
                            
            </table>
                
                </div>
                
                </div>

            </div>
        </main>
    </div>

    <!-- Modal لإضافة/تعديل منتج -->
    <div id="productModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-100 transform transition-all">

            <div class="flex justify-between items-center mb-5">
                <h2 id="modalTitle" class="text-xl font-bold text-gray-800"> Add New Product</h2>
                <button onclick="closeModal()"  class="text-gray-400 hover:text-gray-600 transition">
                    <i class="fa-solid fa-xmark text-lg" > </i>
                </button>
            </div>

            <form id="productForm">    
                <input type="hidden" id="productId">

                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Type Name</label>
                    <input type="text" id="typename"  required placeholder="e.g. Laptop" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">    
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Model / Brand</label>
                    <input type="text" id="Model" placeholder="e.g. Dell XPS" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                </div>

                <div class="mb-4">
                    <label  class="block text-sm font-semibold text-gray-700 mb-1.5">Category</label>
                    <input type="text"  id="category" placeholder="e.g. Electronics" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Price ($)</label>
                    <input type="number" step="0.01" id="price" required placeholder="0.00" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Quantity</label>
                    <input type="number" id="quantity" required placeholder="0" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                </div>

                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 text-gray-700 font-medium rounded-xl hover:bg-gray-200 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 bg-blue-600 text-white font-medium rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-600/20 transition">Save Product</button>
                </div>
            </form>
            
        </div>
    </div>

    <script src="app.js"> </script>
</body>

</html>
